name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Build release assets
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags="-s -w -X main.version=$version" -o dist/oos_linux_amd64 .
          sed 's/\r$//; s/$/\r/' oos.cmd > dist/oos.cmd
          cd dist
          sha256sum oos_linux_amd64 oos.cmd > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
